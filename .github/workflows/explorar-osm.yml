name: Explorar notas (temporal)

# Baja notas que no se pueden leer desde Claude y las deja 15 minutos en la rama "exploracion".
# Este archivo se quita enseguida.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorar-osm.yml"

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar
        run: |
          mkdir -p crudo && cd crudo
          bajar() { curl -sSL --max-time 60 -A "Mozilla/5.0 (compatible; radares-ba/1.2)" -o "$1" "$2" -w "$1 %{http_code} %{size_download}\n" >> estado.txt 2>>estado.txt || echo "$1 ERROR" >> estado.txt; }
          bajar mdp-2026-09.html "https://www.0223.com.ar/nota/2026-9-26-8-1-0-fotomultas-donde-estan-los-radares-semaforicos-y-de-control-de-velocidad-en-mar-del-plata"
          bajar mdp-2025-11.html "https://www.0223.com.ar/nota/2025-11-27-11-46-0-fotomultas-en-que-zonas-se-encuentran-los-radares-en-mar-del-plata"
          bajar mdp-2025-07.html "https://www.0223.com.ar/nota/2025-7-20-13-12-0-atencion-marplatenses-y-turistas-donde-estan-los-radares-fotomultas-en-mar-del-plata"
          bajar quedigital-18.html "https://quedigital.com.ar/sociedad/fotomultas-proyectan-instalar-18-nuevos-puntos-para-sancionar-exceso-de-velocidad-mar-del-plata/"
      - name: Dejar en la rama "exploracion" 15 minutos
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd crudo
          git init -q -b exploracion
          git config user.name "explorador"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Notas para revisar"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$URL" exploracion
          sleep 900
          git push -q "$URL" --delete exploracion || true
