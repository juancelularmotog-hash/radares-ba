name: Limpiar rama temporal

# Borra la rama "exploracion" que dejó la revisión de fuentes. Se quita este archivo en el próximo cambio.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/limpiar-rama.yml"

permissions:
  contents: write

jobs:
  borrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Borrar la rama "exploracion"
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q limpieza && cd limpieza
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete exploracion || echo "La rama ya no estaba."
