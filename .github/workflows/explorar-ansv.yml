name: Explorar ANSV (temporal)

# Baja las páginas de radares autorizados de la ANSV y los datos de su mapa, los deja 15 minutos
# en la rama "exploracion" para revisarlos y después borra la rama. Este archivo se quita enseguida.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorar-ansv.yml"

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar
        run: |
          mkdir -p crudo && cd crudo
          bajar() { curl -sSL --max-time 90 -A "Mozilla/5.0 (compatible; radares-ba/1.2)" -o "$1" "$2" -w "$1 %{http_code} %{size_download} $2\n" >> estado.txt 2>>estado.txt || echo "$1 ERROR $2" >> estado.txt; }
          bajar ansv-fijos.html "https://www.argentina.gob.ar/seguridadvial/radares-fijos-y-moviles-autorizados-para-operar-en-rutas-nacionales"
          bajar ansv-lista.html "https://www.argentina.gob.ar/seguridadvial/radares-autorizados"
          python3 - <<'PY'
          import re, subprocess, html
          urls = set()
          for f in ("ansv-fijos.html", "ansv-lista.html"):
              t = open(f, encoding="utf-8", errors="replace").read()
              for u in re.findall(r'(?:src|href|data-src|data-url)\s*=\s*"([^"]+)"', t):
                  u = html.unescape(u)
                  if re.search(r"google\.com/maps|mid=|umap|arcgis|kml|kmz|geojson|\.json|\.csv|\.xlsx?|docs\.google|datawrapper|carto|mapa|iframe|embed|radar", u, re.I):
                      urls.add(u)
          open("urls.txt", "w").write("\n".join(sorted(urls)) + "\n")
          n = 0
          for u in sorted(urls):
              m = re.search(r"[?&]mid=([\w-]+)", u)
              if m:
                  n += 1
                  subprocess.run(["curl", "-sSL", "--max-time", "90", "-o", f"mymaps_{n}.kml",
                                  f"https://www.google.com/maps/d/kml?mid={m.group(1)}&forcekml=1"])
                  open("estado.txt", "a").write(f"mymaps_{n}.kml mid={m.group(1)}\n")
              elif re.search(r"\.(kml|kmz|geojson|json|csv|xlsx?)(\?|$)", u, re.I) and u.startswith("http"):
                  n += 1
                  nombre = f"dato_{n}_" + re.sub(r"[^\w.]", "_", u.split("?")[0].rsplit("/", 1)[-1])[:60]
                  subprocess.run(["curl", "-sSL", "--max-time", "90", "-o", nombre, u])
                  open("estado.txt", "a").write(f"{nombre} {u}\n")
          PY
          ls -la >> estado.txt
      - name: Dejar en la rama "exploracion" 15 minutos
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd crudo
          git init -q -b exploracion
          git config user.name "explorador"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Archivos crudos de la ANSV para revisar"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$URL" exploracion
          sleep 900
          git push -q "$URL" --delete exploracion || true
