name: Actualizar radares

on:
  schedule:
    - cron: "17 9 * * 1"   # todos los lunes a las 06:17 de Argentina
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-radares
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Descargar fuentes y armar radares.json
        run: python3 scripts/actualizar_radares.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "Sin cambios en los radares."
            exit 0
          fi
          git config user.name "actualizador-radares"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Actualizar radares ($(date -u +%Y-%m-%d))"
          git push
