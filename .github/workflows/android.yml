name: App Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar el APK
        id: compilar
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$RUNNER_TEMP/compilacion.log"

      - name: Publicar el APK en la rama "apk"
        id: publicar
        if: steps.compilar.outcome == 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$APK" "$RUNNER_TEMP/apk/radares-ba.apk"
          cd "$RUNNER_TEMP/apk"
          printf 'Radares BA para Android, versión 1.0.%s\nCompilado el %s desde %s\n' "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%d)" "$GITHUB_SHA" > LEEME.txt
          sha256sum radares-ba.apk >> LEEME.txt
          git init -q -b apk
          git config user.name "compilador-apk"
          git config user.email "actions@users.noreply.github.com"
          git add radares-ba.apk LEEME.txt
          git commit -q -m "APK 1.0.$GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Guardar el resultado en la rama "ci-logs"
        if: always()
        env:
          TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.compilar.outcome }}
          PUBLICADO: ${{ steps.publicar.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cd "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/compilacion.log" android-build.log 2>/dev/null || echo "sin registro" > android-build.log
          printf 'compilacion=%s\npublicacion=%s\nversion=1.0.%s\ncommit=%s\nfecha=%s\n' "$RESULTADO" "$PUBLICADO" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > android-estado.txt
          git init -q -b ci-logs
          git config user.name "compilador-apk"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Registro de compilación Android $GITHUB_RUN_NUMBER: $RESULTADO"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Avisar si no compiló
        if: steps.compilar.outcome != 'success'
        run: |
          echo "La compilación falló; el registro está en la rama ci-logs."
          exit 1
