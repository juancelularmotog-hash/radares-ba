name: Explorar La Plata (temporal)

# Baja de OpenStreetMap lo necesario para ubicar con precisión las fotomultas de La Plata y alrededores
# (calles del Gran La Plata, la Autopista Buenos Aires-La Plata con lo que la cruza, rutas de la zona,
# semáforos y mojones). Deja todo 20 minutos en la rama "exploracion" y después la borra.
# Este archivo se quita enseguida.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorar-la-plata.yml"

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Consultar Overpass
        run: |
          mkdir -p crudo && cd crudo
          cat > consultar.py <<'PY'
          import json, sys, time, urllib.parse, urllib.request
          SERVIDORES = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]
          def overpass(q):
              ultimo = None
              for intento in range(4):
                  for s in SERVIDORES:
                      try:
                          req = urllib.request.Request(s, data=urllib.parse.urlencode({"data": q}).encode(),
                                                       headers={"User-Agent": "radares-ba/1.2 (exploracion)"})
                          with urllib.request.urlopen(req, timeout=400) as r:
                              return r.read()
                      except Exception as e:
                          ultimo = e
                  time.sleep(20 * (intento + 1))
              raise ultimo
          AUTOPISTA = '(-35.00,-58.40,-34.60,-57.85)'
          consultas = {
              "calles_gran_la_plata.json": '[out:json][timeout:300];'
                  'way["highway"]["name"](-35.12,-58.22,-34.78,-57.78);out body;>;out skel qt;',
              "autopista.json": '[out:json][timeout:300];'
                  'way["highway"~"^motorway(_link)?$"]' + AUTOPISTA + ';out body;>;out skel qt;',
              "cruces_autopista.json": '[out:json][timeout:300];'
                  'way["highway"="motorway"]["ref"~"RN ?1"]' + AUTOPISTA + '->.a;'
                  'way(around.a:40)["highway"]["highway"!~"^motorway"];out body;>;out skel qt;',
              "semaforos.json": '[out:json][timeout:300];'
                  'node["highway"="traffic_signals"](-35.25,-58.40,-34.60,-57.40);out body;',
              "rutas_zona.json": '[out:json][timeout:300];'
                  'way["highway"]["ref"~"(RP|RN|AU) ?(1|2|6|11|13|14|36|53|210|215)( |;|$)"](-35.40,-58.45,-34.60,-57.30);'
                  'out body;>;out skel qt;',
              "puentes_nombres.json": '[out:json][timeout:300];'
                  '(way["bridge:name"](-35.00,-58.40,-34.60,-57.85);way["bridge"]["name"~"[Pp]uente"](-35.00,-58.40,-34.60,-57.85);'
                  'way["man_made"="bridge"](-35.00,-58.40,-34.60,-57.85););out body;>;out skel qt;',
          }
          for nombre, q in consultas.items():
              try:
                  datos = overpass(q)
                  open(nombre, "wb").write(datos)
                  print(nombre, len(datos))
              except Exception as e:
                  print(nombre, "ERROR", e)
              time.sleep(10)
          PY
          python3 consultar.py | tee estado.txt
          ls -la >> estado.txt
      - name: Dejar en la rama "exploracion" 20 minutos
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd crudo
          git init -q -b exploracion
          git config user.name "explorador"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Datos de OSM de La Plata para revisar"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$URL" exploracion
          sleep 1200
          git push -q "$URL" --delete exploracion || true
