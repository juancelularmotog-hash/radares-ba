name: Explorar peajes (temporal)

# Baja de OpenStreetMap las cabinas de peaje con las calles en las que están (y el entorno de las que
# están en ramales), para ver en qué mano cobra cada una. Deja todo 20 minutos en la rama "exploracion"
# y después la borra. Este archivo se quita enseguida.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorar-peajes.yml"

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Consultar Overpass
        run: |
          mkdir -p crudo && cd crudo
          cat > consultar.py <<'PY'
          import json, sys, time, urllib.parse, urllib.request
          SERVIDORES = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"]
          def overpass(q):
              ultimo = None
              for intento in range(4):
                  for s in SERVIDORES:
                      try:
                          req = urllib.request.Request(s, data=urllib.parse.urlencode({"data": q}).encode(),
                                                       headers={"User-Agent": "radares-ba/1.2 (exploracion)"})
                          with urllib.request.urlopen(req, timeout=400) as r:
                              return r.read()
                      except Exception as e:
                          ultimo = e
                  time.sleep(20 * (intento + 1))
              raise ultimo
          AREA = '(area["ISO3166-2"="AR-B"];area["ISO3166-2"="AR-C"];)->.a;'
          consultas = {
              "peajes_cabinas.json": '[out:json][timeout:300];' + AREA +
                  'node["barrier"="toll_booth"](area.a)->.b;.b out body;'
                  'way(bn.b)["highway"];out body geom;'
                  'way["barrier"="toll_booth"](area.a);out body geom;',
              "peajes_entorno_ramales.json": '[out:json][timeout:300];' + AREA +
                  'node["barrier"="toll_booth"](area.a)->.b;way(bn.b)["highway"~"_link$"]->.l;'
                  'node(w.l)->.n;node.n.b->.bl;'
                  'way(around.bl:900)["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)(_link)?$"];'
                  'out body geom;',
          }
          for nombre, q in consultas.items():
              try:
                  datos = overpass(q)
                  open(nombre, "wb").write(datos)
                  print(nombre, len(datos))
              except Exception as e:
                  print(nombre, "ERROR", e)
              time.sleep(10)
          PY
          python3 consultar.py | tee estado.txt
          ls -la >> estado.txt
      - name: Dejar en la rama "exploracion" 20 minutos
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd crudo
          git init -q -b exploracion
          git config user.name "explorador"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Peajes de OSM para revisar"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$URL" exploracion
          sleep 1200
          git push -q "$URL" --delete exploracion || true
